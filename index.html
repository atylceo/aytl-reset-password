<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reset your password — Aytl</title>
<style>
  :root {
    --background: #FBF6EF;
    --surface: #FFFFFF;
    --ink: #1C1B18;
    --ink-secondary: #6B6459;
    --accent: #1B5943;
    --accent-soft: #E4EEE9;
    --danger: #B3261E;
    --border: #E7DFD2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #12181A;
      --surface: #1B2224;
      --ink: #F3EFE8;
      --ink-secondary: #A9A196;
      --accent: #3E8468;
      --accent-soft: #1F2F27;
      --danger: #F2867B;
      --border: #2A3234;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--background);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 4px;
  }
  h2 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--ink-secondary);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--background);
    color: var(--ink);
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .message {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .message.success { background: var(--accent-soft); color: var(--ink); }
  .message.error { background: var(--accent-soft); color: var(--danger); }
  .hint {
    font-size: 12px;
    color: var(--ink-secondary);
    margin: -8px 0 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Aytl</h1>
    <div id="content">
      <h2>Loading…</h2>
    </div>
  </div>

<script>
  // Supabase's own project details -- the anon/publishable key is safe to
  // embed (same reasoning as SupabaseConfig.swift in the app): it just
  // identifies the project, Row Level Security does the real access
  // control. This page's own authority to change the password comes from
  // the one-time recovery access_token below, not from this key.
  const SUPABASE_URL = "https://uwursnbdszmulruywpbo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_BxPjhWSmjuKgS-fcjJq2oA_Fg-ewX5Y";

  const content = document.getElementById("content");

  // Supabase's recovery link redirects here with the token in the URL
  // *fragment* (like an OAuth implicit-flow callback), e.g.
  // "#access_token=...&type=recovery&...". A few Supabase configurations
  // send it as query params instead, so both are checked.
  function readParams() {
    const fromHash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const fromQuery = new URLSearchParams(window.location.search);
    const get = (key) => fromHash.get(key) || fromQuery.get(key);
    return {
      accessToken: get("access_token"),
      type: get("type"),
      error: get("error"),
      errorDescription: get("error_description"),
    };
  }

  function renderError(message) {
    content.innerHTML = `
      <h2>Link no longer works</h2>
      <div class="message error">${escapeHtml(message)}</div>
      <p class="sub">Go back to the app and request a new reset link from the sign-in screen.</p>
    `;
  }

  function renderForm() {
    content.innerHTML = `
      <h2>Set a new password</h2>
      <p class="sub">Choose a new password for your Aytl account.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required minlength="8">
        <p class="hint" id="hint">At least 8 characters.</p>
        <button type="submit" id="submit-btn">Set new password</button>
      </form>
    `;

    const form = document.getElementById("reset-form");
    const hint = document.getElementById("hint");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8) {
        hint.textContent = "Password must be at least 8 characters.";
        hint.style.color = "var(--danger)";
        return;
      }
      if (password !== confirm) {
        hint.textContent = "Passwords don't match.";
        hint.style.color = "var(--danger)";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";

      try {
        const { accessToken } = readParams();
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${accessToken}`,
          },
          body: JSON.stringify({ password }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.msg || body.error_description || body.message || "Couldn't set the new password.");
        }

        content.innerHTML = `
          <h2>Password updated</h2>
          <div class="message success">Your password has been reset. Go back to the Aytl app and sign in with your new password.</div>
        `;
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Set new password";
        hint.textContent = err.message || "Something went wrong. Try again.";
        hint.style.color = "var(--danger)";
      }
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  const params = readParams();
  if (params.error) {
    renderError(params.errorDescription || "This reset link has expired or was already used.");
  } else if (params.accessToken && params.type === "recovery") {
    renderForm();
  } else {
    renderError("This page only works when opened from a password-reset email.");
  }
</script>
</body>
</html>
